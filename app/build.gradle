plugins {
    id 'com.android.application'
}
android {
    namespace 'com.sidrachain.wallet'
    compileSdk 34
    defaultConfig {
        applicationId "com.sidrachain.wallet"
        minSdk 24
        targetSdk 34
        // APP_VERSION diisi dari GitHub Actions (github.run_number = angka tag, mis. 87).
        // Build lokal tanpa env -> fallback 1 / "1.0.0".
        def appVer = System.getenv("APP_VERSION")
        versionCode appVer ? appVer.toInteger() : 1
        versionName appVer ?: "1.0.0"
    }
    signingConfigs {
        config {
            storeFile file("sidrawallet.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.config
            debuggable true
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.config
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}
