name: Build SidraWallet APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Debug - struktur repo
        run: |
          echo "PWD: $(pwd)"
          echo "--- isi root repo"
          ls -la
          echo "--- file kunci Gradle (maks 3 level)"
          find . -maxdepth 3 \( -name gradlew -o -name "build.gradle*" -o -name "settings.gradle*" -o -name "gradle-wrapper.properties" \) -not -path "./.git/*"
          echo "--- folder app/"
          ls -la app 2>&1 || echo "FOLDER app/ TIDAK ADA di root"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default action ini memasang paket "tools" yang sudah dihapus dari
          # repository Google (error: Failed to find package 'tools').
          # String kosong = lewati paket tambahan. Lisensi tetap diterima otomatis.
          packages: ''

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 kosong atau belum dibuat (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          test -d app || { echo "::error::Folder app/ tidak ada di root repo. Cek struktur folder di step Debug."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > app/sidrawallet.jks
          ls -l app/sidrawallet.jks

      - name: Grant gradlew Permission
        run: |
          test -f ./gradlew || { echo "::error::gradlew tidak ada di root repo."; exit 1; }
          chmod +x ./gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace --info --warning-mode all

      - name: Verify APK Exists
        run: ls -lah app/build/outputs/apk/release/

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: SidraWallet v${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
